name: Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Cache addon dependencies
        uses: actions/cache@v4
        with:
          path: |
            ./libs
            ./.libraries
          key: addon-deps-${{ hashFiles('install-deps.sh') }}

      - name: Install addon dependencies
        run: bash install-deps.sh

      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install busted
        run: luarocks install busted

      - name: Run tests
        run: busted

  # The changelog generator (tools/changelog) and the script that keeps its notes.
  changelog-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test the changelog generator
        run: go test ./tools/changelog/

  # The in-game changelog this pull request would ship, written by Gemini, in the job summary.
  # Only for pull requests from this repository: forks have no access to the key.
  changelog-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Write the changelog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./tools/changelog -channel alpha -from "${{ github.event.pull_request.base.sha }}" -to "${{ github.event.pull_request.head.sha }}" -store "$RUNNER_TEMP/changelog-store" -out "$RUNNER_TEMP/changelogdata.lua"
          {
            echo "### The changelog this pull request would ship"
            echo '```lua'
            sed -n '/^changelogData.releases/,$p' "$RUNNER_TEMP/changelogdata.lua"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
